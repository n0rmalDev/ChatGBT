[theme]
# Base theme setting
base = "dark"

# Accent purple for buttons, focus borders, sliders, etc.
primaryColor = "#8B5CF6"

# Main chat background (Pitch Black)
backgroundColor = "#000000"

# Sidebar & input box background (Dark Charcoal)
secondaryBackgroundColor = "#121212"

# Main text color (Off-White)
textColor = "#FFFFFF"

# Font style
font = "sans serif"